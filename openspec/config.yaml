schema: spec-driven

context: |
  Portafolio Astro 7, TypeScript estricto, Tailwind CSS 4, GSAP, zod y pnpm.
  Atomic Modular Stack: UI en src/components; estado/persistencia en src/features;
  fetching, inicializadores y utilidades en src/lib. Alias @atoms, @molecules,
  @organisms, @features, @layouts, @lib. Arquitectura en .omp/AGENTS.md.
  Harness OMP. Roles/permisos en .omp/config.yml; instrucciones en .omp/AGENTS.md.
  Luna coordina; Astra propone en un worktree; revisión humana; Flash o Sonnet
  aplica en el mismo worktree; comprobaciones; archive/sync.
  Propose solo escribe artefactos. Cambios triviales no requieren OpenSpec.
  test_command: pnpm check && pnpm build
  test_command es una convención dentro de context, no un campo nativo ejecutado por
  OpenSpec. agent:verify lo ejecuta mediante pnpm agent:test.
  No existe suite unitaria/e2e: check analiza Astro/TypeScript; build compila.
  Cambios visuales/interactivos requieren evidencia adicional de accesibilidad,
  responsive y comportamiento en navegador.

rules:
  proposal:
    - Delimitar alcance, exclusiones, riesgos y capa Atomic afectada.
  specs:
    - Usar Requirement, Scenario y SHALL/MUST con escenarios verificables.
  design:
    - Documentar archivos, contratos, tokens y decisiones suficientes para implementar sin chat.
    - En este pipeline spec-driven siempre producir design.md, aunque sea breve.
  tasks:
    - Incluir implementación y validación concreta; no marcar done sin ejecución.
    - Cerrar con pnpm agent:verify <nombre> y la revisión funcional pertinente.
