# Instalación limpia: sin reglas de proyecto ni globales. Solo autenticación y MCP,
# que viven en la configuración global de OMP (~/.omp, ~/.pi) y no se tocan aquí.
tools:
  approvalMode: yolo
bash:
  allowCompoundCommands: true
  # Destraba las etapas tdd/harden del ciclo ágil TDD (docs/flujo-agil-tdd.md).
  # Corren en approvalMode: yolo dentro de sus subagentes, pero esta entrada
  # aplica a cualquier sesión del repo, no solo a esos tres agentes.
  patterns:
    - { match: 'pnpm test', approval: allow }
    - { match: 'pnpm test:mutation', approval: allow }
    - { match: 'pnpm test:complexity', approval: allow }
    - { match: 'pnpm check:boundaries', approval: allow }
# Roles de modelo del ciclo ágil TDD (docs/flujo-agil-tdd.md). Dedicados y no
# reutilizados de otros carriles para no acoplar su ajuste a otros pipelines.
modelRoles:
  story: openai-codex/gpt-5.6-luna:medium
  gherkin: openai-codex/gpt-6-astra:medium
  tdd: opencode-go/deepseek-v4.1-flash:medium
  harden: anthropic/claude-sonnet-5:high
skills:
  enableCodexUser: false
  enableClaudeUser: false
  enableClaudeProject: false
  enableAgentsUser: false
  enableAgentsProject: false
  enablePiUser: false
  enablePiProject: false
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
