modelRoles:
  spec_writer: anthropic/claude-opus-5:high
  spec_executor: opencode-go/glm-5.3:high
  spec_validator: opencode-go/deepseek-v4-pro:max

tools:
  approvalMode: write
  approval:
    bash: prompt

bash:
  patterns:
    - match: "rm -rf *"
      approval: deny
    - match: "git push --force*"
      approval: deny
    - match: "git reset --hard*"
      approval: deny
    - match: "*"
      approval: allow

retry:
  fallbackChains:
    spec_executor:
      - opencode-go/glm-5.2
      - anthropic/claude-sonnet-5
    spec_validator:
      - opencode-go/kimi-k3
      - anthropic/claude-sonnet-5
